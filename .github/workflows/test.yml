---
name: test

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.25'

      - name: Lint
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: make lint

      - name: Test
        run: make test

      - name: Publish coverage to coveralls.io
        uses: shogo82148/actions-goveralls@25f5320d970fb565100cf1993ada29be1bb196a1 # v1
        if: ${{ matrix.os == 'ubuntu-latest' }}
        with:
          path-to-profile: coverage.out

      - name: Build
        run: go build ./cmd/s5
